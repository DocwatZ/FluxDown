# FluxDown Server — Docker Compose deployment
#
# Quick start:  docker compose up -d
# View logs:    docker compose logs -f fluxdown-server
#
# First run: the management token is printed once to the log on startup:
#   docker compose logs fluxdown-server 2>&1 | grep -i token
# The token is also stored in the data volume (SQLite config table) and
# survives restarts.  To regenerate it, delete the 'local_server_token' row
# from the config table and restart.
#
# Unraid users: set PUID/PGID to match the owner of your appdata/downloads
# shares (usually found in Settings -> Users on your Unraid server).
services:
  fluxdown-server:
    image: ghcr.io/zerx-lab/fluxdown-server:latest
    # Local build (replace the image: line above):
    # build:
    #   context: ..
    #   dockerfile: docker/server.Dockerfile
    container_name: fluxdown-server
    restart: unless-stopped
    ports:
      - "17800:17800"
    volumes:
      - fluxdown-data:/data       # SQLite DB, logs, and management token
      - ./downloads:/downloads    # Default download directory (maps to FLUXDOWN_DOWNLOAD_DIR)
    environment:
      # ── User / permission mapping (important for Unraid and NAS) ──────────
      PUID: "1000"   # Host UID that should own downloaded files and DB
      PGID: "1000"   # Host GID that should own downloaded files and DB
      # ── Download location ────────────────────────────────────────────────
      FLUXDOWN_DOWNLOAD_DIR: "/downloads"  # Written as default_save_dir on first run
      # ── Language (optional) ──────────────────────────────────────────────
      # FLUXDOWN_LANG: "en"   # Force English UI (en / zh); per-browser choice overrides
      # ── External database (optional, PostgreSQL) ─────────────────────────
      # FLUXDOWN_DATABASE_URL: "******host:5432/fluxdown"
      # ── Demo / restricted mode (optional) ───────────────────────────────
      # FLUXDOWN_DEMO: "1"    # Restrict downloads to the built-in demo file
    # healthcheck is defined in the Dockerfile; override timing here if needed:
    # healthcheck:
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 15s

volumes:
  fluxdown-data:
